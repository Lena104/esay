<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work — ESAY</title><meta name="description" content="교육 현장의 문제를 도구와 프로젝트로 바꾼 ESAY의 작업."><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="mobile-header"><a class="brand" href="index.html">ESAY</a><a href="index.html">HOME →</a></header>
  <aside class="sidebar"><a class="brand" href="index.html">ESAY</a><nav aria-label="주요 메뉴"><a href="work.html"><b>01</b><span>WORK</span></a><a href="notes.html"><b>02</b><span>NOTES</span></a><a href="training.html"><b>03</b><span>TRAINING</span></a><a href="about.html"><b>04</b><span>ABOUT</span></a><a href="index.html#contact"><b>→</b><span>CONTACT</span></a></nav></aside>
  <main id="main" class="page-shell">
    <header class="page-intro"><p class="eyebrow">01 / SELECTED WORK</p><h1>WORK</h1><p>설명보다 먼저, 현장의 문제를 해결하며 만든 실제 작업을 보여줍니다.</p></header>
    <section class="full-list" data-work-list><p class="status">작업을 불러오는 중입니다.</p></section>
  </main>
  <script type="module">
    import { loadData, fallback } from './js/data-loader.js';
    const list = document.querySelector('[data-work-list]');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
    const safeLink = (value) => { const text = String(value || ''); if (/^[a-z0-9-]+\.html(?:\?id=[a-z0-9-]+)?$/i.test(text)) return text; try { const parsed = new URL(text); return parsed.protocol === 'https:' ? parsed.href : ''; } catch { return ''; } };
    loadData('projects.json', fallback.projects).then((projects) => {
      list.innerHTML = projects.map((project, index) => {
        const href = safeLink(project.detailUrl), tag = href ? 'a' : 'article', attribute = href ? ` href="${escapeHtml(href)}"${project.external ? ' target="_blank" rel="noopener noreferrer"' : ''}` : '';
        return `<${tag} class="work-row"${attribute}><span>${String(index + 1).padStart(2, '0')}</span><div><p class="eyebrow">${escapeHtml(project.category)}</p><h3>${escapeHtml(project.title)}</h3></div><p>${escapeHtml(project.summary)}</p><b aria-hidden="true">→</b></${tag}>`;
      }).join('');
    });
  </script>
</body>
</html>
