<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work — ESAY</title><meta name="description" content="교육 현장의 문제를 도구와 프로젝트로 바꾼 ESAY의 작업."><link rel="stylesheet" href="css/style.css"></head><body><a class="skip-link" href="#main">본문 바로가기</a><header class="mobile-header"><a class="brand" href="index.html">ESAY</a><a href="index.html">HOME →</a></header><aside class="sidebar"><a class="brand" href="index.html">ESAY</a><nav aria-label="주요 메뉴"><a href="work.html"><b>01</b><span>WORK</span></a><a href="notes.html"><b>02</b><span>NOTES</span></a><a href="training.html"><b>03</b><span>TRAINING</span></a><a href="about.html"><b>04</b><span>ABOUT</span></a><a href="index.html#contact"><b>→</b><span>CONTACT</span></a></nav></aside><main id="main" class="page-shell"><header class="page-intro"><p class="eyebrow">01 / SELECTED WORK</p><h1>WORK</h1><p>설명보다 먼저, 현장의 문제를 해결하며 만든 실제 작업을 보여줍니다.</p></header><section class="full-list" data-work-list><p class="status">작업을 불러오는 중입니다.</p></section></main><script type="module">import{loadData,fallback}from'./js/data-loader.js';const e=document.querySelector('[data-work-list]'),x=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));loadData('projects.json',fallback.projects).then(a=>e.innerHTML=a.map((p,i)=>`<article><span>0${i+1}</span><div><p class="eyebrow">${x(p.category)}</p><h3>${x(p.title)}</h3></div><p>${x(p.summary)}</p><b>→</b></article>`).join(''));</script></body></html>
