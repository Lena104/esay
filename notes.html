<body>

  <main id="main" class="page-shell">
    <header class="page-intro">
      <p class="eyebrow">02 / FIELD NOTES</p>
      <h1>NOTES</h1>
      <p>완성된 답보다, 배우고 만들며 발견한 단서를 기록합니다.</p>
    </header>
    <div class="section-head notes-source"><p class="eyebrow">SERIES</p><span>연재별로 모아보기</span></div>
    <section class="note-series-grid" data-note-series><p class="status">연재를 불러오는 중입니다.</p></section>
  </main>
  <script type="module">
    import { loadData } from './js/data-loader.js';
    const list = document.querySelector('[data-note-series]');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    const safeUrl = (value) => {
      try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch {
        return '';
      }
    };

    Promise.all([loadData('note-series.json', []), loadData('notes.json', [])]).then(([seriesList, notes]) => {
      list.innerHTML = seriesList.length ? seriesList.sort((a,b)=>(a.sortOrder||999)-(b.sortOrder||999)).map((series) => {
        const count = notes.filter((note) => !note.seriesId || note.seriesId === series.id).length;
        return `<a class="note-series-card" href="${escapeHtml(series.detailUrl)}"><p class="eyebrow">${escapeHtml(series.label || 'BRUNCH MAGAZINE')}</p><span>${count} ARTICLES</span><h2>${escapeHtml(series.title)}</h2><p>${escapeHtml(series.description)}</p><b>연재 보기 →</b></a>`;
      }).join('') : '<p class="status">새로운 연재를 준비 중입니다.</p>';
    });
  </script>
</body>
</html>
