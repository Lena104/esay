name: Sync Small Experiments

on:
  repository_dispatch:
    types: [experiments-sheet-updated]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: sync-small-experiments
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Experiments sheet
        run: node scripts/sync-experiments.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_EXPERIMENTS_SHEET_ID: ${{ vars.GOOGLE_EXPERIMENTS_SHEET_ID }}
      - name: Commit changed experiments
        run: |
          if git diff --quiet -- data/experiments.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experiments.json
          git commit -m "chore: sync Small Experiments"
          git push
      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p public-dist/data
          cp index.html 404.html about.html notes.html training.html work.html work-admin-toolkit.html work-small-experiments.html public-dist/
          cp robots.txt sitemap.xml public-dist/
          cp -R css js public-dist/
          cp data/canva-videos.json data/experiments.json data/lecture-history.json data/notes.json data/projects.json public-dist/data/
      - name: Deploy synced experiments
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-dist --project-name=esay --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
