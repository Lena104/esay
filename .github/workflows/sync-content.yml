name: Sync public content
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. 매일 18:20 UTC에 실행합니다.
    - cron: '20 18 * * *'
permissions:
  contents: write
  deployments: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync YouTube
        id: youtube
        continue-on-error: true
        run: node scripts/sync-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_MAX_RESULTS: ${{ vars.YOUTUBE_MAX_RESULTS }}
      - name: Sync Brunch
        id: brunch
        continue-on-error: true
        run: node scripts/sync-brunch.mjs
      - name: Sync Calendar
        id: calendar
        continue-on-error: true
        run: node scripts/sync-calendar.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID_1: ${{ vars.GOOGLE_CALENDAR_ID_1 }}
          GOOGLE_CALENDAR_ID_2: ${{ vars.GOOGLE_CALENDAR_ID_2 }}
      - name: Commit changed public data
        run: |
          if git diff --quiet -- data/lecture-history.json data/canva-videos.json data/notes.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lecture-history.json data/canva-videos.json data/notes.json
          git commit -m "chore: sync public ESAY content"
          git push
      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p public-dist/data
          cp index.html 404.html about.html notes.html training.html work.html work-detail.html work-admin-toolkit.html work-pincanvas.html work-small-experiments.html public-dist/
          cp robots.txt sitemap.xml public-dist/
          cp favicon.svg public-dist/
          cp -R css js public-dist/
          cp -R images public-dist/
          cp data/canva-videos.json data/experiments.json data/lecture-history.json data/notes.json data/projects.json data/work-details.json public-dist/data/
      - name: Deploy synced content
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-dist --project-name=esay --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Report sync failures
        if: always()
        env:
          YOUTUBE_OUTCOME: ${{ steps.youtube.outcome }}
          BRUNCH_OUTCOME: ${{ steps.brunch.outcome }}
          CALENDAR_OUTCOME: ${{ steps.calendar.outcome }}
        run: |
          if [ "$YOUTUBE_OUTCOME" = "failure" ]; then
            echo "::error::YouTube content sync failed. Other successful content changes were preserved."
          fi
          if [ "$BRUNCH_OUTCOME" = "failure" ]; then
            echo "::error::Brunch content sync failed. Existing notes and other successful content changes were preserved."
          fi
          if [ "$CALENDAR_OUTCOME" = "failure" ]; then
            echo "::error::Calendar content sync failed. Other successful content changes were preserved."
          fi
          if [ "$YOUTUBE_OUTCOME" = "failure" ] || [ "$BRUNCH_OUTCOME" = "failure" ] || [ "$CALENDAR_OUTCOME" = "failure" ]; then
            exit 1
          fi
