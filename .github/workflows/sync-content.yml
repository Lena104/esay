name: Sync public content
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. 매일 18:20 UTC에 실행합니다.
    - cron: '20 18 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync YouTube
        run: node scripts/sync-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_MAX_RESULTS: ${{ vars.YOUTUBE_MAX_RESULTS }}
      - name: Sync Calendar
        run: node scripts/sync-calendar.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID_1: ${{ vars.GOOGLE_CALENDAR_ID_1 }}
          GOOGLE_CALENDAR_ID_2: ${{ vars.GOOGLE_CALENDAR_ID_2 }}
      - name: Commit changed public data
        run: |
          if git diff --quiet -- data/lecture-history.json data/canva-videos.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lecture-history.json data/canva-videos.json
          git commit -m "chore: sync public ESAY content"
          git push
