name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p public-dist/data
          cp index.html 404.html about.html notes.html training.html work.html work-detail.html work-admin-toolkit.html work-pincanvas.html work-small-experiments.html public-dist/
          cp robots.txt sitemap.xml public-dist/
          cp -R css js public-dist/
          cp -R images public-dist/
          cp data/canva-videos.json data/experiments.json data/lecture-history.json data/notes.json data/projects.json data/work-details.json public-dist/data/

      - name: Deploy production site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-dist --project-name=esay --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
